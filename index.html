<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="J Fragance - Catálogo exclusivo de perfumes de lujo. Descubre nuestra colección premium de fragancias para mujer y hombre.">
    <meta name="theme-color" content="#0a0a0f">
    <title>J Fragance | Perfumes de Lujo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f0d68a;
            --gold-dark: #a8882a;
            --text: #f5f5f5;
            --text-muted: rgba(255,255,255,0.5);
            --bg: #0a0a0f;
            --bg-card: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Montserrat', Arial, sans-serif;
            --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- BG GIF --- */
        .bg-gif {
            position: fixed; inset: 0; z-index: -3;
            width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .bg-overlay {
            position: fixed; inset: 0; z-index: -2;
            background: rgba(10,10,15,0.65);
            pointer-events: none;
        }

        /* --- NOISE OVERLAY --- */
        .noise {
            position: fixed; inset: 0; z-index: -1;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* --- HEADER --- */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 1.5rem 3rem;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.4s var(--ease);
        }
        .header.scrolled {
            background: rgba(10,10,15,0.85);
            backdrop-filter: blur(24px);
            padding: 1rem 3rem;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: var(--font-display);
            font-size: 1.6rem; font-weight: 400;
            letter-spacing: 0.3em; color: var(--text);
            text-decoration: none;
        }
        .logo span { color: var(--gold); }
        .nav-list {
            display: flex; gap: 2.5rem;
            list-style: none; align-items: center;
        }
        .nav-link {
            color: var(--text-muted); text-decoration: none;
            font-size: 0.7rem; font-weight: 400;
            letter-spacing: 0.15em; text-transform: uppercase;
            position: relative; transition: color 0.3s ease;
            cursor: pointer; border: none; background: none;
            font-family: var(--font-body);
        }
        .nav-link:hover { color: var(--text); }
        .nav-link.active { color: var(--text); }
        .nav-link.active::after {
            content: ''; position: absolute;
            bottom: -4px; left: 0; right: 0; height: 1px;
            background: var(--gold);
        }
        .nav-link.whatsapp {
            display: flex; align-items: center; gap: 0.4rem;
            color: var(--gold);
        }
        .nav-link.whatsapp svg { width: 14px; height: 14px; }

        /* --- HERO --- */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding: 8rem 2rem 4rem;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute; inset: 0; z-index: -2;
            background: radial-gradient(ellipse at 50% 30%, rgba(212,175,55,0.12) 0%, transparent 60%);
        }
        .hero-particles {
            position: absolute; inset: 0; z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--gold); border-radius: 50%;
            opacity: 0;
            animation: float-particle 20s infinite;
        }
        @keyframes float-particle {
            0%, 100% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        .hero-title {
            margin-bottom: 2rem;
            opacity: 0; transform: translateY(30px);
            animation: hero-fade-in 1.2s var(--ease) 0.4s forwards;
        }
        @keyframes hero-fade-in {
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-title h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            background: linear-gradient(135deg, var(--text) 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-sub {
            font-size: 0.7rem; letter-spacing: 0.25em;
            text-transform: uppercase; color: var(--text-muted);
            margin-top: 0.5rem;
        }
        .hero-price {
            display: flex; align-items: center; gap: 1rem;
            margin-top: 3rem;
            opacity: 0; transform: translateY(20px);
            animation: hero-fade-in 0.8s var(--ease) 1s forwards;
        }
        .hero-price-line {
            width: 40px; height: 1px; background: var(--gold);
        }
        .hero-price-text {
            font-size: 0.65rem; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .hero-price-amount {
            font-family: var(--font-display);
            font-size: 1.8rem; color: var(--gold);
        }
        .hero-price-amount small {
            font-family: var(--font-body);
            font-size: 0.6rem; color: var(--text-muted);
            margin-left: 0.3rem;
        }

        .scroll-hint {
            position: absolute; bottom: 2rem;
            display: flex; flex-direction: column; align-items: center;
            gap: 0.5rem; color: var(--text-muted);
            opacity: 0;
            animation: hero-fade-in 0.8s var(--ease) 1.5s forwards;
        }
        .scroll-hint span {
            font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
        }
        .scroll-hint svg {
            width: 18px; height: 18px;
            stroke: var(--gold); fill: none;
            animation: scroll-bounce 2s infinite;
        }
        @keyframes scroll-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }

        /* --- GALLERY --- */
        .gallery {
            padding: 6rem 2rem 4rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }
        .gallery-header {
            text-align: center; margin-bottom: 4rem;
        }
        .gallery-header h2 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 300; letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--text) 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .gallery-header p {
            font-size: 0.7rem; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--text-muted);
        }

        .gender-section {
            max-width: 1400px; margin: 0 auto 5rem;
        }
        .gender-section:last-child { margin-bottom: 0; }

        .gender-label {
            font-family: var(--font-display);
            font-size: 1.4rem; font-weight: 400;
            letter-spacing: 0.2em; color: var(--text-muted);
            margin-bottom: 2rem; text-align: center;
        }
        .gender-label span { color: var(--gold); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s var(--ease);
            position: relative;
            opacity: 0; transform: translateY(30px);
        }
        .card.visible { opacity: 1; transform: translateY(0); }
        .card:hover { transform: translateY(-8px); }
        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: all 0.5s var(--ease);
        }
        .card:hover .card-img-wrap {
            border-color: rgba(212,175,55,0.25);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
        }
        .card-img-wrap::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 50%, rgba(212,175,55,0.04) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .card img {
            max-width: 75%; max-height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 16px 32px rgba(0,0,0,0.5));
            transition: transform 0.6s var(--ease);
        }
        .card:hover img { transform: scale(1.12); }
        .card-brand {
            font-size: 0.55rem; letter-spacing: 0.25em;
            text-transform: uppercase; color: var(--text-muted);
            margin-bottom: 0.2rem;
            transition: color 0.3s var(--ease);
        }
        .card:hover .card-brand { color: var(--gold); }
        .card-name {
            font-family: var(--font-display);
            font-size: 1.1rem; font-weight: 400;
            color: var(--text);
            line-height: 1.3;
        }

        /* --- FOOTER --- */
        .footer {
            padding: 3rem 2rem; text-align: center;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }
        .footer p {
            font-size: 0.7rem; color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem;
            background: rgba(5,5,10,0.8);
            backdrop-filter: blur(16px);
            opacity: 0; visibility: hidden;
            transition: all 0.4s var(--ease);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            position: relative;
            width: 100%; max-width: 440px;
            background: linear-gradient(145deg, rgba(25,25,35,0.98) 0%, rgba(15,15,20,0.98) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            transform: scale(0.92) translateY(20px);
            transition: all 0.4s var(--ease);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }
        .modal-close {
            position: absolute; top: 0.75rem; right: 0.75rem;
            width: 36px; height: 36px;
            border: none; background: rgba(255,255,255,0.05);
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .modal-close:hover { background: rgba(255,255,255,0.1); transform: rotate(90deg); }
        .modal-close svg { width: 18px; height: 18px; stroke: var(--text-muted); stroke-width: 2; fill: none; }
        .modal-image {
            width: 100%; height: 180px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.02);
            border-radius: 12px; overflow: hidden;
        }
        .modal-image img {
            max-width: 75%; max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4));
        }
        .modal-brand {
            font-size: 0.65rem; letter-spacing: 0.25em;
            text-transform: uppercase; color: var(--gold);
            text-align: center; margin-bottom: 0.3rem;
        }
        .modal-name {
            font-family: var(--font-display);
            font-size: 1.8rem; font-weight: 400;
            text-align: center; margin-bottom: 1.5rem;
        }
        .modal-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 0.75rem; width: 100%;
            padding: 0.9rem 1.5rem;
            border: none; border-radius: 12px;
            font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer; text-decoration: none;
            transition: all 0.3s var(--ease);
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #0a0a0f;
        }
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212,175,55,0.3);
        }
        .modal-btn svg { width: 18px; height: 18px; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .header { padding: 1rem 1.5rem; }
            .header.scrolled { padding: 0.8rem 1.5rem; }
            .nav-list { gap: 1.25rem; }
            .nav-link { font-size: 0.6rem; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .gallery-header h2 { font-size: 1.8rem; }
            .hero-title h1 { letter-spacing: 0.08em; }
        }
        @media (max-width: 480px) {
            .logo { font-size: 1.3rem; }
            .grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
            .modal { padding: 1.5rem; }
            .modal-name { font-size: 1.4rem; }
        }
    </style>
</head>

        function getPerfumeImage(name, brand, gender) {
            const folder = gender === 'mujer' ? 'mujer' : 'hombre';
            const fullKey = `${name}|${brand}`;
            if (imageNameMap[fullKey]) {
                const value = imageNameMap[fullKey];
                if (typeof value === 'object') return `images/${folder}/${value[gender] || value.hombre}`;
                return `images/${folder}/${value}`;
            }
            for (const [key, value] of Object.entries(imageNameMap)) {
                const names = key.split('|');
                if (name.includes(names[0]) && brand.includes(names[1])) {
                    if (typeof value === 'object') return `images/${folder}/${value[gender] || value.hombre}`;
                    return `images/${folder}/${value}`;
                }
            }
            const nameFormatted = name.toUpperCase().replace(/'/g,'').replace(/°/g,'').replace(/\s+/g,'_').replace(/[^A-Z0-9_]/g,'');
            const brandFormatted = brand.toUpperCase().replace(/&/g,'').replace(/\s+/g,'_').replace(/[^A-Z0-9_]/g,'');
            return `images/${folder}/${nameFormatted}_${brandFormatted}-removebg-preview.png`;

        function createGallery() {
            ['galleryMujer', 'galleryHombre'].forEach(id => {
                const container = document.getElementById(id);
                const gender = id === 'galleryMujer' ? 'mujer' : 'hombre';
                allPerfumes.filter(p => p.gender === gender).forEach(perfume => {
                    const card = document.createElement('article');
                    card.className = 'card';
                    card.dataset.perfume = JSON.stringify(perfume);
                    const imgPath = getPerfumeImage(perfume.name, perfume.brand, perfume.gender);
                    card.innerHTML = `
                        <div class="card-img-wrap">
                            <img src="${imgPath}" alt="${perfume.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />

                        <p class="card-brand">${perfume.brand}</p>

        const modalOverlay = document.getElementById('modalOverlay');

        const modalClose = document.getElementById('modalClose');

        function openModal(perfume) {
            modalImage.src = getPerfumeImage(perfume.name, perfume.brand, perfume.gender);
            modalImage.alt = perfume.name;
            modalBrand.textContent = perfume.brand;
            modalName.textContent = perfume.name;
            const msg = encodeURIComponent(`Hola! Me interesa el perfume ${perfume.name} - ${perfume.brand}`);
            modalWhatsapp.href = `https://api.whatsapp.com/send?phone=573194284340&text=${msg}`;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });

        function filtrarCategoria(genero) {
            document.querySelectorAll('.gender-section').forEach(s => {
                s.style.display = s.dataset.genero === genero ? 'block' : 'none';
            });
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => {
                if (b.textContent.toLowerCase().trim() === genero) b.classList.add('active');
            });
            document.getElementById('coleccion').scrollIntoView({ behavior: 'smooth' });
        }

        // Scroll animations (Intersection Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        window.addEventListener('scroll', () => {
            header.classList.toggle('scrolled', window.scrollY > 50);
        });

            document.querySelectorAll('.card').forEach(card => observer.observe(card));
